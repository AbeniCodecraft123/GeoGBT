<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GeoAI</title>
  <link rel="stylesheet" href="../static/css/style.css">
</head>
<body>

  <!-- LOGO -->
  <div class="logo">GeoAI</div>

  <!-- MAIN -->
  <main class="hero" style="
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
  ">

    <h1 style="margin-bottom: 15px;">
      Welcome to GeoField Assistant
    </h1>

    <p style="
      max-width: 600px;
      line-height: 1.6;
      color: #bdbdbd;
      margin-bottom: 30px;
    ">
      GeoField Assistant is part of GeoAI, a platform designed to help you understand
      Geoscience — including Geology and Geophysics.
      You can ask questions, learn core concepts, and get guidance for field and
      subsurface investigations in a simple and interactive way.
    </p>

    <!-- GET STARTED BUTTON -->
    <button style="
      padding: 16px 40px;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 30px;
      border: none;
      background: #2563eb;
      color: white;
      cursor: pointer;
    "
    onclick="window.location.href='app.html'">
      Get Started
    </button>

  </main>

</body>
</html>
