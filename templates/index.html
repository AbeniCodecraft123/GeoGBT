<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GeoGBT | Home</title>

  <!-- Bootstrap (optional but helpful) -->
  <link href="{{ url_for('static', filename='assets/vendor/bootstrap/css/bootstrap.min.css') }}" rel="stylesheet">

  <style>
    /* Reset */
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    /* Hero Section */
    .hero {
      height: 100vh;
      width: 100%;
      background-image: url("{{ url_for('static', filename='img/istockphoto-1302842094-612x612.jpg') }}");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;

      color: #fff;
      position: relative;
    }

    /* Dark overlay */
    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
    }

    /* Content */
    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 700px;
      padding: 20px;
    }

    .hero h1 {
      font-size: 3rem;
      font-weight: 700;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 1.2rem;
      margin-bottom: 30px;
    }

    .hero a {
      display: inline-block;
      padding: 14px 36px;
      background: #0d6efd;
      color: #fff;
      text-decoration: none;
      border-radius: 30px;
      font-size: 1.1rem;
      transition: 0.3s ease;
    }

    .hero a:hover {
      background: #084298;
      transform: translateY(-2px);
    }
  </style>
</head>

<body>

  <!-- HERO / HOMEPAGE -->
 <section class="hero">
  <div class="hero-content">
    <h1>GeoGBT</h1>
    <p>
      An intelligent geoscience platform integrating
      Geology, Geophysics, and GeoAI solutions
    </p>

    <a href="{{ url_for('sign_up') }}" class="hero-btn">
      Get Started with GeoGBT
    </a>
  </div>
</section>


</body>
</html>
