  <link href="{{ url_for('static', filename='assets/vendor/bootstrap/css/bootstrap.min.css') }}" rel="stylesheet">

  <style>
    /* Reset */
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    /* Hero Section */
    .hero {
      height: 100vh;
      width: 100%;
      background-image: url("{{ url_for('static', filename='img/istockphoto-1302842094-612x612.jpg') }}");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;

      color: #fff;
      position: relative;
    }

    /* Dark overlay */
    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
    }

    /* Content */
    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 700px;
      padding: 20px;
    }

    .hero h1 {
      font-size: 3rem;
      font-weight: 700;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 1.2rem;
      margin-bottom: 30px;
    }

    .hero a {
      display: inline-block;
      padding: 14px 36px;
      background: #0d6efd;
      color: #fff;
      text-decoration: none;
      border-radius: 30px;
      font-size: 1.1rem;
      transition: 3s ease;
    }

    .hero a:hover {
      background: #084298;
      transform: translateY(-2px);
    }
    /* Page Loader */
#page-loader {
    position: fixed;
    inset: 0;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
}

.loader-content {
    text-align: center;
}

.loader-logo {
    width: 80px;
    margin-bottom: 15px;
    animation: pulse 4s infinite;
}

.spinner {
    width: 35px;
    height: 35px;
    border: 3px solid #e0e0e0;
    border-top: 3px solid #111;
    border-radius: 50%;
    animation: spin 3s linear infinite;
}

/* Animations */
@keyframes spin {
    to { transform: rotate(360deg); }
}

@keyframes pulse {
    0% { opacity: 0.6; }
    50% { opacity: 1; }
    100% { opacity: 0.6; }
}

/* Hide loader */
body.loaded #page-loader {
    opacity: 0;
    pointer-events: none;
    transition: opacity 3.1s ease;
}

  </style>
</head>

<body>
<!-- Page Loader -->
<div id="page-loader">

</div>

  </div>
</section>


</body>
